name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build (without the leading v)"
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }

          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Version must look like 1.2.3. Received: $version"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package executable
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $artifact = "FcknDelete-$version.zip"
          Compress-Archive -Path "target\release\FcknDelete.exe" -DestinationPath $artifact -Force
          "artifact=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FcknDelete-${{ steps.version.outputs.version }}
          path: ${{ env.artifact }}

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.artifact }}
          generate_release_notes: true
          draft: false
          prerelease: false