name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/build.yml"
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked

      - name: Prepare artifact
        shell: pwsh
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE "target/release/FcknDelete.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected binary not found at: $exePath"
          }

          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          Copy-Item $exePath "artifacts/FcknDelete.exe"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FcknDelete-windows-x86_64
          path: artifacts/FcknDelete.exe
          if-no-files-found: error