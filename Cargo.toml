[package]
name = "fckn-delete"
version = "0.1.0"
edition = "2024"

[dependencies]
rfd = "0.17.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_RestartManager", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
winreg = "0.56.0"

[build-dependencies]
embed-manifest = "1.5.1"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "FcknDelete"
path = "src/main.rs"
